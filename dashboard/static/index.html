<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAD Agent Dashboards</title>
  <!-- The query string is a cache-buster: bump it with DASHBOARD_VERSION in server.py. -->
  <link rel="stylesheet" href="style.css?v=2026-09-08.2">
</head>
<body>
  <header>
    <h1>CAD Agent Dashboards</h1>
    <div class="header-right">
      <button id="newDashboard" class="primary-btn">+ New dashboard</button>
      <div class="conn" id="connStatus">connecting…</div>
    </div>
  </header>

  <main id="lanes">
    <p class="empty" id="emptyState">
      No dashboards yet. Click <strong>+ New dashboard</strong>, then assign it a drawing
      file. Tell the agent which dashboard to work in — it can't pick a drawing itself.
    </p>
  </main>

  <template id="laneTemplate">
    <section class="lane">
      <div class="lane-head">
        <img class="avatar-thumb" alt="agent avatar">
        <div class="lane-meta">
          <div class="lane-title">
            <span class="lane-name"></span>
            <span class="lane-id"></span>
          </div>
          <div class="lane-file">
            <input type="text" class="file-input" spellcheck="false"
                   placeholder="C:\path\to\drawing.dwg — assign a drawing">
            <button class="file-set">Assign</button>
            <span class="file-status"></span>
          </div>
        </div>
        <label class="upload-btn">
          Avatar
          <input type="file" class="avatar-input" accept="image/*" hidden>
        </label>
        <button class="delete-btn" title="Delete dashboard">×</button>
      </div>

      <div class="lane-run">
        <!-- 100+ blocks: a search box with a grouped menu instead of a wall of buttons. -->
        <div class="palette-row">
          <span class="palette-label">Add block</span>
          <div class="palette">
            <input type="search" class="palette-search" spellcheck="false" autocomplete="off"
                   placeholder="Search commands… draw, offset, trim, dimension, layer">
            <div class="palette-menu" hidden></div>
          </div>
          <span class="palette-count"></span>
        </div>

        <ol class="sequence"></ol>
        <p class="sequence-empty">
          No blocks yet — pick one above. Blocks run top to bottom on this
          dashboard's drawing, no chat needed.
        </p>

        <div class="run-controls">
          <button class="run-btn">Run sequence</button>
          <button class="resume-btn" disabled hidden>Resume</button>
          <button class="stop-btn" disabled>Stop</button>
          <button class="clear-btn">Clear</button>
          <span class="run-status"></span>
        </div>
      </div>

      <div class="lane-body">
        <!-- The agent stays put; whatever tool it is using pops up above it, and the
             last few tools trail off underneath. -->
        <div class="stage">
          <div class="stage-agent">
            <div class="tool-bubble idle">
              <span class="tool-bubble-name">idle</span>
              <span class="tool-bubble-detail"></span>
            </div>
            <img class="avatar" alt="agent avatar">
          </div>
          <div class="tool-trail"></div>
        </div>
        <div class="log"></div>
      </div>
    </section>
  </template>

  <!-- One step in a dashboard's sequence. The parameter inputs inside
       .block-params are generated from the block's spec served by /blocks. -->
  <template id="blockTemplate">
    <li class="block" draggable="true">
      <div class="block-head">
        <span class="block-grip" title="Drag to reorder">⠿</span>
        <span class="block-step"></span>
        <span class="block-label"></span>
        <span class="block-desc"></span>
        <label class="block-repeat" title="Run this block this many times">
          ×<input type="number" class="repeat-input" min="1" value="1">
        </label>
        <button class="block-btn block-up" title="Move up">↑</button>
        <button class="block-btn block-down" title="Move down">↓</button>
        <button class="block-btn block-dup" title="Duplicate">⧉</button>
        <button class="block-btn block-del" title="Remove">×</button>
      </div>
      <div class="block-params"></div>
    </li>
  </template>

  <script src="app.js?v=2026-09-08.2"></script>
</body>
</html>
